[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aicoding-agent"
version = "0.1.0"
description = "A controlled AI coding and frontend delivery agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "prompt-toolkit>=3.0.50,<4",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
delivery = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "playwright>=1.49,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
aicoding-agent = "aicoding_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aicoding_agent"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.test-tmp"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".test-tmp", ".tools", ".uv-cache", ".venv"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC240"]
